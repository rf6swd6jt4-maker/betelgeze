name: Foundations

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Optional comparison base; otherwise merge base with main, or previous commit on main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          cache: npm
      - name: Resolve immutable comparison base
        env:
          FOUNDATION_MANUAL_BASE: ${{ inputs.base_ref }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolveFoundationBase } from './scripts/check-foundation-changes.mjs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const base = resolveFoundationBase(process.cwd(), process.env.GITHUB_EVENT_NAME, event, process.env.FOUNDATION_MANUAL_BASE || '');
          appendFileSync(process.env.GITHUB_ENV, `FOUNDATION_BASE=${base}\n`);
          console.log(`Comparison base tree: ${base}`);
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Migration history, new migrations, whitespace and changed JS/TS lint
        run: node scripts/check-foundation-changes.mjs --base "$FOUNDATION_BASE" --lint
      - name: Client connection calendar SQL regression
        run: |
          npm install --prefix "$RUNNER_TEMP/be-pglite" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-client-connection-controls-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-free-client-ghl-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-client-connection-retirement-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-ghl-appointment-automation-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-ghl-oauth-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-meta-reporting-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-client-advertising-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-current-client-connections-sql.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-staff-google-ads-sql.mjs
      - name: Shared service queue authorization and lifecycle
        run: BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-shared-service-queue.mjs
      - name: Portal upload team access and private downloads
        run: |
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-portal-upload-team-access.mjs
          BE_PGLITE_ROOT="$RUNNER_TEMP/be-pglite" node scripts/validate-portal-upload-download.mjs
      - name: Full test suite
        run: npm test
      - name: Production webpack build with local placeholders
        run: npx next build --webpack

  isolated-postgres:
    name: Isolated PostgreSQL 16 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BE_RECORDS_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - name: Check out synthetic SQL fixture and migrations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Run independent connections in a fresh socket-only database
        env:
          BE_RECORDS_PG_EVIDENCE: ${{ runner.temp }}/records-postgres-evidence.json
        run: node scripts/validate-records-postgres-concurrency.mjs
      - name: Rehearse concurrent Comms indexes and guarded RPC installation
        env:
          BE_REFERENCES_PG_EVIDENCE: ${{ runner.temp }}/references-postgres-evidence.json
        run: node scripts/validate-communication-references-postgres.mjs
      - name: Verify optimized shared reads across independent PostgreSQL connections
        env:
          BE_COMMUNICATION_READ_PG_EVIDENCE: ${{ runner.temp }}/communication-read-postgres.json
        run: node scripts/validate-communication-read-postgres.mjs
      - name: Verify device read concurrency with encrypted canonical decoders
        run: |
          npm install --prefix "$RUNNER_TEMP/device-pg-deps" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.8 pg@8.16.3
          device_cluster=$(mktemp -d "$RUNNER_TEMP/device-unread-pg.XXXXXX")
          "$BE_RECORDS_PG_BIN/initdb" -D "$device_cluster/data" --username=fixture_owner --auth-local=trust --auth-host=trust
          trap '"$BE_RECORDS_PG_BIN/pg_ctl" -D "$device_cluster/data" -m fast stop || true' EXIT
          "$BE_RECORDS_PG_BIN/pg_ctl" -D "$device_cluster/data" -l "$device_cluster/server.log" -o "-h 127.0.0.1 -p 45680 -k $device_cluster -c max_connections=12 -c shared_buffers=16MB" -w start
          BE_DEVICE_POSTGRES_URL=postgresql://fixture_owner@127.0.0.1:45680/postgres BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/device-unread-progressive/postgres-checks.mjs "$RUNNER_TEMP/device-unread-native-postgres.json"
      - name: Verify shared service queue concurrent actions and removal
        run: BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/shared-service-queue/postgres.mjs
      - name: Verify GHL OAuth and appointment workers across independent PostgreSQL connections
        run: |
          npm install --prefix "$RUNNER_TEMP/device-pg-deps" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.8 pg@8.16.3 typescript@5.9.3
          BE_GHL_NATIVE_PG=1 BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-ghl-oauth-sql.mjs
          BE_GHL_NATIVE_PG=1 BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-ghl-appointment-automation-sql.mjs
          BE_GHL_NATIVE_PG=1 BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-meta-reporting-sql.mjs
          BE_GHL_NATIVE_PG=1 BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-current-client-connections-sql.mjs
          BE_GHL_NATIVE_PG=1 BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-staff-google-ads-sql.mjs
      - name: Verify concurrent Client chat additions and participant-save costs
        run: BE_CLIENT_CHAT_PG_BIN="$BE_RECORDS_PG_BIN" BE_PG_ROOT="$RUNNER_TEMP/device-pg-deps" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pg-deps" node scripts/validate-client-chat-team-members.mjs --native
      - name: Print device concurrency evidence
        if: always()
        run: cat "$RUNNER_TEMP/device-unread-native-postgres.json"
      - name: Print shared read concurrency evidence
        if: always()
        run: cat "${{ runner.temp }}/communication-read-postgres.json"
      - name: Print tested SQL runtime and source manifest
        if: always()
        env:
          BE_RECORDS_PG_EVIDENCE: ${{ runner.temp }}/records-postgres-evidence.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync(process.env.BE_RECORDS_PG_EVIDENCE, 'utf8'));
          console.log(JSON.stringify({
            outcome: evidence.outcome,
            passed: evidence.passed,
            productionCalls: evidence.productionCalls,
            serverStopped: evidence.serverStopped,
            runtime: evidence.observations.find((item) => item.name === 'runtime'),
            sources: evidence.sources,
          }, null, 2));
          NODE
      - name: Print concurrent index rehearsal evidence
        if: always()
        env:
          BE_REFERENCES_PG_EVIDENCE: ${{ runner.temp }}/references-postgres-evidence.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          console.log(readFileSync(process.env.BE_REFERENCES_PG_EVIDENCE, 'utf8'));
          NODE

  communications-sql:
    name: Isolated Communications read and unread SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact read, inbox and push fixtures
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install pinned optional SQL fixture runtime outside the application
        run: |
          echo "BE_PGLITE_ROOT=$RUNNER_TEMP/communications-pglite" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/communications-pglite" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.8
      - name: Validate indexed WhatsApp phone routing and isolation
        run: node scripts/validate-whatsapp-inbound-routing.mjs
      - name: Validate manager-only Client chat additions from Team chat
        run: node scripts/validate-client-chat-team-members.mjs
      - name: Validate atomic cursors, deletion boundaries, summaries and authorization
        run: node scripts/validate-communications-unread-sql.mjs
      - name: Validate encrypted device counts, previews, search and rollback
        run: node scripts/device-unread-progressive/production-checks.mjs "$RUNNER_TEMP/device-unread-production-sql.json"
      - name: Compare optimized shared read RPC with the exact prior definition
        run: node scripts/validate-communication-read-efficiency.mjs
      - name: Validate encrypted compact inbox and historical read positions
        run: node scripts/validate-native-inbox-sql.mjs
      - name: Validate unchanged push eligibility against retained read boundaries
        run: node scripts/validate-chat-push-recovery.mjs
      - name: Validate Library roles, private attachments and bounded authorization
        run: node scripts/validate-library-authorization.mjs
      - name: Validate bounded search contact authorization and query plans
        run: node scripts/validate-search-contact-access.mjs
      - name: Validate search retrieval, canonical access and discovery limits
        run: node scripts/validate-workspace-search-retrieval.mjs
      - name: Validate search ranking, related destinations and archive boundaries
        run: node scripts/validate-workspace-search-capability.mjs
      - name: Validate bounded Comms references and guarded installation
        run: |
          node scripts/validate-communication-references-sql.mjs
          node scripts/validate-communication-references-release.mjs
          node scripts/validate-communication-references-online-release.mjs
      - name: Validate service transfer ownership, recovery and immutable history
        run: node scripts/validate-service-assignee-transfer.mjs
      - name: Validate service-scoped appointment booking commands
        run: node scripts/validate-appointment-service-booking-commands.mjs
      - name: Validate guarded service-transfer installation and rollback
        run: node scripts/validate-service-transfer-release.mjs

  browser-regression:
    name: Browser foundations (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install application and isolated browser tooling
        run: |
          npm ci
          npm ci --prefix scripts/browser --ignore-scripts
          node scripts/browser/node_modules/playwright/cli.js install --with-deps "${{ matrix.engine }}"
      - name: Exercise viewport, departure, and draft recovery with synthetic data
        run: node scripts/browser/run-foundations.mjs "${{ matrix.engine }}"
      - name: Exercise chat actions, popup lifecycle, media and safe areas with synthetic data
        run: node scripts/browser/run-comms-polish.mjs "${{ matrix.engine }}"
      - name: Exercise roster dismissal and hidden chrome cleanup
        run: node scripts/browser/run-comms-roster-cleanup.mjs "${{ matrix.engine }}"
      - name: Exercise Client chat additions from a client's Team roster
        env:
          CLIENT_CHAT_MEMBERS_OUTPUT: browser-results/client-chat-team-members
        run: node scripts/browser/run-client-chat-team-members.mjs "${{ matrix.engine }}"
      - name: Exercise acknowledged reads and unread updates on mobile and desktop
        run: node scripts/browser/run-comms-reads.mjs "${{ matrix.engine }}"
      - name: Exercise confirmed remote reads across isolated browser contexts
        run: node scripts/browser/run-comms-convergence.mjs "${{ matrix.engine }}"
      - name: Exercise delayed chat pane attachment and reload initialization
        run: node scripts/browser/run-comms-pane-lifecycle.mjs "${{ matrix.engine }}"
      - name: Exercise shared dialog dismissal and refresh presentation
        run: node scripts/browser/run-ui-reconciliation.mjs "${{ matrix.engine }}"
      - name: Exercise shared panel loading on mobile and desktop
        run: node scripts/browser/run-panel-loading.mjs "${{ matrix.engine }}"
      - name: Exercise native loading, refresh, retry and access loss
        run: node scripts/browser/run-native-loading.mjs "${{ matrix.engine }}"
      - name: Exercise asset selection and single and archive downloads
        run: node scripts/browser/run-asset-library.mjs "${{ matrix.engine }}"
      - name: Exercise appointment summary links and retained lifecycle states
        run: node scripts/browser/run-ghl-appointment-summary.mjs "${{ matrix.engine }}"
      - name: Exercise unified notification and calendar appointment navigation
        run: node scripts/browser/run-portal-appointment-navigation.mjs "${{ matrix.engine }}"
      - name: Exercise retained WhatsApp template buttons
        run: node scripts/browser/run-whatsapp-template-evidence.mjs "${{ matrix.engine }}"
      - name: Exercise client connection menus and calendar selection
        run: node scripts/browser/run-client-connections.mjs "${{ matrix.engine }}"
      - name: Client advertising connections browser regression
        run: node scripts/browser/run-client-advertising.mjs "${{ matrix.engine }}"
      - name: Exercise provider-first staff connection setup
        run: node scripts/browser/run-add-client-connection.mjs "${{ matrix.engine }}"
      - name: Exercise verified Meta onboarding, maintenance and retained reports
        run: BE_WINDSOR_BROWSER_OUTPUT="$RUNNER_TEMP/windsor-${{ matrix.engine }}" node scripts/validate-windsor-browser.mjs "${{ matrix.engine }}"
      - name: Exercise app connection and explicit WhatsApp activation
        run: node scripts/browser/run-ghl-app-connections.mjs "${{ matrix.engine }}"
      - name: Exercise multiple portal calendars and cache isolation
        run: node scripts/browser/run-ghl-multiple-calendars.mjs "${{ matrix.engine }}"
      - name: Exercise shared service assignment and command recovery
        run: node scripts/browser/run-shared-service-queue.mjs "${{ matrix.engine }}"
      - name: Exercise service transfer preview, acknowledgement and recovery
        run: node scripts/browser/run-service-transfer.mjs "${{ matrix.engine }}"
      - name: Exercise on-demand relationship queue refresh and access loss
        run: node scripts/browser/run-relationship-queue-refresh.mjs "${{ matrix.engine }}"
      - name: Exercise relationship drawers and native/iframe modal cleanup
        run: node scripts/browser/run-context-overlays.mjs "${{ matrix.engine }}"
      - name: Exercise popup lifetime across frame removal and navigation
        run: node scripts/browser/run-modal-owner-lifecycle.mjs "${{ matrix.engine }}"
      - name: Exercise retained Settings popup ownership and drafts
        run: node scripts/browser/run-settings-popup-ownership.mjs "${{ matrix.engine }}"
      - name: Preserve initially open forms under StrictMode
        run: SETTINGS_POPUP_STRICT=1 node scripts/browser/run-settings-popup-ownership.mjs "${{ matrix.engine }}"
      - name: Exercise anchored menu owner departure
        run: node scripts/browser/run-anchored-popup-lifetime.mjs "${{ matrix.engine }}"
      - name: Exercise OKR dialog dismissal and owner departure
        run: node scripts/browser/run-okr-popup-lifetime.mjs "${{ matrix.engine }}"
      - name: Exercise relationship shortcuts through actual shell routing
        run: node scripts/browser/run-workspace-linked-detail.mjs "${{ matrix.engine }}"
      - name: Print detailed browser evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/windsor-${{ matrix.engine }}/browser-results.json"; then
            cat "$RUNNER_TEMP/windsor-${{ matrix.engine }}/browser-results.json"
          fi
          for report in foundations fullscreen-comms-actions comms-reads comms-convergence-candidate comms-pane-lifecycle ui-reconciliation panel-loading native-loading relationship-queue-refresh context-overlays modal-owner-lifecycle settings-popup-ownership settings-popup-ownership-strict anchored-popup-lifetime okr-popup-lifetime comms-roster-cleanup workspace-linked-detail; do
            if test -f "browser-results/$report.json"; then
              cat "browser-results/$report.json"
            else
              echo "$report evidence unavailable: inspect the preceding installation or runner step."
            fi
          done

  device-full-app:
    name: Device unread production app (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:45679
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-only
      SUPABASE_SERVICE_ROLE_KEY: fixture-service
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:45678
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install isolated browser and SQL tooling
        run: |
          npm ci
          npm ci --prefix scripts/browser --ignore-scripts
          node scripts/browser/node_modules/playwright/cli.js install --with-deps "${{ matrix.engine }}"
          npm install --prefix "$RUNNER_TEMP/device-pglite" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.8
      - name: Build the complete production app against loopback placeholders
        run: npx next build --webpack
      - name: Validate real shell, API, encrypted SQL and separate devices
        run: BE_BROWSER_TEST_ROOT="$GITHUB_WORKSPACE/scripts/browser" BE_PGLITE_ROOT="$RUNNER_TEMP/device-pglite" BE_FULL_APP_ENGINES="${{ matrix.engine }}" BE_FULL_APP_SAMPLES=1 node scripts/full-app-device-unread/run.mjs "$GITHUB_WORKSPACE" device "$RUNNER_TEMP/device-full-app.json"
      - name: Print full-app evidence
        if: always()
        run: cat "$RUNNER_TEMP/device-full-app.json"
